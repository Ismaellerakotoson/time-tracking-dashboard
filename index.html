<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Time Tracking Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="dashboard">

      <!-- Carte profil -->
      <div class="profile">
        <div class="profile__user">
          <img
            class="profile__avatar"
            src="images/image-jeremy.png"
            alt="Photo de Jeremy Robson"
          />
          <div>
            <p class="profile__label">Report for</p>
            <h1 class="profile__name">Jeremy Robson</h1>
          </div>
        </div>

        <nav class="profile__nav" aria-label="Période">
          <button class="profile__period" data-period="daily" id="daily">Daily</button>
          <button class="profile__period profile__period--active" data-period="weekly" id="weekly">Weekly</button>
          <button class="profile__period" data-period="monthly" id="monthly">Monthly</button>
        </nav>
      </div>

      <!-- Cartes activité -->
      <article class="card card--work">
        <div class="card__accent" aria-hidden="true">
          <img src="images/icon-work.svg" alt="" />
        </div>
        <div class="card__body">
          <div class="card__header">
            <p class="card__title">Work</p>
            <button class="card__options" aria-label="Options Work">
              <img src="images/icon-ellipsis.svg" alt="" />
            </button>
          </div>
          <p class="card__hours">
            <span class="hour"></span>
            <span>hrs</span>
          </p>
          <p class="card__last">Last
            <span class="time">Week -</span>
            <span class="time-duration"></span>
            <span>hrs</span>
          </p>
        </div>
      </article>

      <article class="card card--play">
        <div class="card__accent" aria-hidden="true">
          <img src="images/icon-play.svg" alt="" />
        </div>
        <div class="card__body">
          <div class="card__header">
            <p class="card__title">Play</p>
            <button class="card__options" aria-label="Options Play">
              <img src="images/icon-ellipsis.svg" alt="" />
            </button>
          </div>
          <p class="card__hours">
            <span class="hour"></span>
            <span>hrs</span>
          </p>
          <p class="card__last">Last
            <span class="time">Week -</span>
            <span class="time-duration"></span>
            <span>hrs</span>
          </p>
        </div>
      </article>

      <article class="card card--study">
        <div class="card__accent" aria-hidden="true">
          <img src="images/icon-study.svg" alt="" />
        </div>
        <div class="card__body">
          <div class="card__header">
            <p class="card__title">Study</p>
            <button class="card__options" aria-label="Options Study">
              <img src="images/icon-ellipsis.svg" alt="" />
            </button>
          </div>
          <p class="card__hours">
            <span class="hour"></span>
            <span>hrs</span>
          </p>
          <p class="card__last">Last
            <span class="time">Week -</span>
            <span class="time-duration"></span>
            <span>hrs</span>
          </p>
        </div>
      </article>

      <article class="card card--exercise">
        <div class="card__accent" aria-hidden="true">
          <img src="images/icon-exercise.svg" alt="" />
        </div>
        <div class="card__body">
          <div class="card__header">
            <p class="card__title">Exercise</p>
            <button class="card__options" aria-label="Options Exercise">
              <img src="images/icon-ellipsis.svg" alt="" />
            </button>
          </div>
          <p class="card__hours">
            <span class="hour"></span>
            <span>hrs</span>
          </p>
          <p class="card__last">Last
            <span class="time">Week -</span>
            <span class="time-duration"></span>
            <span>hrs</span>
          </p>
        </div>
      </article>

      <article class="card card--social">
        <div class="card__accent" aria-hidden="true">
          <img src="images/icon-social.svg" alt="" />
        </div>
        <div class="card__body">
          <div class="card__header">
            <p class="card__title">Social</p>
            <button class="card__options" aria-label="Options Social">
              <img src="images/icon-ellipsis.svg" alt="" />
            </button>
          </div>
          <p class="card__hours">
            <span class="hour"></span>
            <span>hrs</span>
          </p>
          <p class="card__last">Last
            <span class="time">Week -</span>
            <span class="time-duration"></span>
            <span>hrs</span>
          </p>
        </div>
      </article>

      <article class="card card--self-care">
        <div class="card__accent" aria-hidden="true">
          <img src="images/icon-self-care.svg" alt="" />
        </div>
        <div class="card__body">
          <div class="card__header">
            <p class="card__title">Self Care</p>
            <button class="card__options" aria-label="Options Self Care">
              <img src="images/icon-ellipsis.svg" alt="" />
            </button>
          </div>
          <p class="card__hours">
            <span class="hour"></span>
            <span>hrs</span>
          </p>
          <p class="card__last">Last
            <span class="time">Week -</span>
            <span class="time-duration"></span>
            <span>hrs</span>
          </p>
        </div>
      </article>

    </main>
  </body>
</html>
